plugins {
  id 'java'
  id 'war'
}

repositories {
  mavenCentral()
}

ext {
  junitVersion = '6.1.3'
}

java {
  sourceCompatibility = '25'
  targetCompatibility = '25'
}

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

dependencies {
  compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')
  implementation('org.glassfish.jersey.containers:jersey-container-servlet:4.0.2')
  implementation('org.glassfish.jersey.media:jersey-media-json-jackson:4.0.2')
  implementation('org.glassfish.jersey.inject:jersey-hk2:4.0.2')

  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
useJUnitPlatform()}